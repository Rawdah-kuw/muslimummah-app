workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodemagicAppStore
    environment:
      groups:
        - ios_signing
      flutter: 3.29.3
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "app.muslimummah"
    scripts:
      - name: Regenerate iOS with CocoaPods (classic template, no Swift PM)
        script: |
          set -e
          # Preserve the pearl app icons across the regeneration.
          rm -rf /tmp/appicon
          if [ -d ios/Runner/Assets.xcassets/AppIcon.appiconset ]; then
            cp -r ios/Runner/Assets.xcassets/AppIcon.appiconset /tmp/appicon
          fi
          flutter config --no-enable-swift-package-manager
          rm -rf ios
          flutter create --platforms=ios --org app --project-name muslimummah .
          # Raise the minimum iOS version to 15.0 (Apple no longer accepts 12.0).
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" ios/Flutter/AppFrameworkInfo.plist || true
          sed -i '' "s/^# *platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/^platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          # Restore the pearl app icons.
          if [ -d /tmp/appicon ]; then
            rm -rf ios/Runner/Assets.xcassets/AppIcon.appiconset
            cp -r /tmp/appicon ios/Runner/Assets.xcassets/AppIcon.appiconset
          fi
          # Re-apply the app's Info.plist settings.
          python3 - <<'PY'
          import re
          p = 'ios/Runner/Info.plist'
          s = open(p, encoding='utf-8').read()
          desc = 'يُستخدم موقعك لتحديد اتجاه القبلة فقط، ولا يُخزَّن ولا يُشارَك.'
          name = 'Muslim Ummah'
          if '<key>CFBundleDisplayName</key>' in s:
              s = re.sub(r'(<key>CFBundleDisplayName</key>\s*<string>)[^<]*(</string>)',
                         lambda m: m.group(1) + name + m.group(2), s)
              dn = ''
          else:
              dn = '\t<key>CFBundleDisplayName</key>\n\t<string>' + name + '</string>\n'
          extra = (dn +
                   '\t<key>NSLocationWhenInUseUsageDescription</key>\n\t<string>' + desc + '</string>\n' +
                   '\t<key>NSLocationAlwaysAndWhenInUseUsageDescription</key>\n\t<string>' + desc + '</string>\n' +
                   '\t<key>NSLocationAlwaysUsageDescription</key>\n\t<string>' + desc + '</string>\n' +
                   '\t<key>ITSAppUsesNonExemptEncryption</key>\n\t<false/>\n')
          if 'NSLocationWhenInUseUsageDescription' not in s:
              s = s.replace('</dict>\n</plist>', extra + '</dict>\n</plist>')
          open(p, 'w', encoding='utf-8').write(s)
          print('Info.plist patched')
          PY
          # Register the notification-centre delegate (needed for iOS local
          # notifications to present reliably).
          python3 - <<'PY'
          p = 'ios/Runner/AppDelegate.swift'
          s = open(p, encoding='utf-8').read()
          if 'UNUserNotificationCenter.current().delegate' not in s:
              inject = ('if #available(iOS 10.0, *) {\n'
                        '      UNUserNotificationCenter.current().delegate = self as? UNUserNotificationCenterDelegate\n'
                        '    }\n'
                        '    GeneratedPluginRegistrant.register(with: self)')
              s = s.replace('GeneratedPluginRegistrant.register(with: self)', inject, 1)
              open(p, 'w', encoding='utf-8').write(s)
              print('AppDelegate patched')
          PY
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing (create certificate & profile if missing)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload the build (available for internal testing immediately).
        # External beta review is submitted manually once test info is filled.
        submit_to_testflight: false

  android-googleplay:
    name: Android → Google Play (AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Reference to the Android keystore you upload in Codemagic
      # (Team settings → Code signing identities → Android keystores).
      # The reference name below MUST match what you name it there.
      android_signing:
        - muslimummah_keystore
      flutter: 3.29.3
      vars:
        PACKAGE_NAME: "app.muslimummah.twa"
    scripts:
      - name: Create key.properties from the uploaded keystore
        script: |
          set -e
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          echo "key.properties written (storeFile=$CM_KEYSTORE_PATH)"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build signed release App Bundle (.aab for Google Play)
        script: flutter build appbundle --release
      - name: Build signed release APK (for direct install / testing)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - a.alkandari@ktech.edu.kw
        notify:
          success: true
          failure: true
      # To auto-publish to Google Play later, connect a Google Play service
      # account in Codemagic and uncomment the block below:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
