name: muslimummah
description: "Muslim Ummah — an Islamic knowledge network: books, curriculum, smart search, and Rawdah dhikr gatherings."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.6
  http: ^1.2.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  webview_flutter: ^4.8.0
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  geolocator: ^13.0.1
  sensors_plus: ^6.0.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/books.json
    - assets/data/curriculum.json
    - assets/data/wird.json
    - assets/data/accounts.json
    - assets/data/adhkar.json
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
